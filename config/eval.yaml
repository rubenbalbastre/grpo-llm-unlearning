evaluation:
  model_name_or_path: outputs/unlearning-3568/final_model
  output_dir: outputs/unlearning-3568/eval_rwku
  subjects: Rihanna
  training_config_path: null
  shard:
    index: 0
    count: 1

  sets:
    forget: true
    neighbor: true
    mia: true
    utility: true

  metrics:
    generation: rouge_l_recall
    mia:
      loss: true
      zlib: false
      min_k: false
      min_k_plus_plus: false

  limits:
    max_utility_examples: 2000
    utility_sample_strategy: random # first or random; applied before sharding.
    utility_sample_seed: 42

  batch_size: 32
  mia_batch_size: 32
  utility_batch_size:
    utility_general: 32
    utility_reason: 32
    utility_truthfulness: 32
    utility_factuality: 32
    utility_fluency: 32
  choice_likelihood_batch_size: 16
  generation:
    max_new_tokens: 256
    temperature: 0.0
  model:
    label: null
    torch_dtype: auto
    trust_remote_code: false
    attn_implementation: null
  checkpoint:
    path: null
    label: null
    milestone_index: null
    milestone_num_tokens: null
    global_step: null
    num_input_tokens_seen: null

  wandb:
    enabled: true
    entity: null
    run_name: rwku-${evaluation.subjects}
    artifact_name: rwku-${evaluation.subjects}-model
    log_model_artifact: true
    link_to_training_run: false
