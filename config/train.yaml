defaults:
  - _self_

experiment:
  seed: 42
  forget_concept: Stephen King
  push_to_hub: false

paths:
  output_root: outputs

model:
  name: "Qwen/Qwen2.5-1.5B-Instruct" # "microsoft/Phi-3-mini-4k-instruct", Qwen/Qwen2.5-3B-Instruct, Qwen/Qwen2.5-1.5B-Instruct

wandb:
  run_name: ${training.mode}-${data_generator.data_proposer.mode}-${oc.env:SLURM_JOB_ID,local}

data_generator:
  safe: false
  new_prompts_per_step: 0.05 # Fraction of the rollout prompt batch generated each step.
  data_proposer:
    model_name: gpt-5.4-nano
    mode: "expanded" # natural or expanded
    proposer_context:
      context_mode: summary # summary or rollout_outcomes
      context_max_prompts: 4
      context_max_completions_per_prompt: 4

standard_data:
  name: jinzhuoran/RWKU
  config_name: train_refusal_phi3
  split: train
  subject_column: subject
  prompt_column: instruction
  dataset_size: 100 # Samples retained after filtering by forget_concept, e.g. 100.

offline_data:
  path: outputs/offline-synthetic/prompts_stephen_king.jsonl
  split: train
  prompt_column: prompt
  dataset_size: 100 # Samples retained from the fixed offline synthetic dataset, e.g. 100.

buffer:
  max_prompts: 512
  high_reward_std_threshold: 0.2
  high_mean_reward_threshold: 0.3

reward:
  mode: binary # entity_count or binary

peft:
  lora:
    r: 64
    alpha: 128
    init_lora_weights: "gaussian"
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    number_layers_to_transform: -1 # Set to -1 to apply LoRA to all transformer layers.

training:
  mode: offline # adaptive, standard, or offline
  per_device_train_batch_size: 16
  num_generations: 4
  gradient_accumulation_steps: 8
  gradient_checkpointing: True
  steps_per_generation: 8
  num_iterations: 2
  beta: 0.04
  learning_rate: 1.0e-5
  max_completion_length: 256
  remove_unused_columns: false
  log_completions: true
  logging_steps: 5
  max_steps: 100000 # too large since token budget callback will stop training when the token budget is reached. Set to -1 to disable.
  num_epochs: 40 # Applied only when mode is standard and max_steps is -1.
  lr_scheduler_type: "constant"
  callback:
    token_budget: 3_000_000 #3_000_000 # null if not using StopOnTokenBudgetCallback

hydra:
  job:
    chdir: false
