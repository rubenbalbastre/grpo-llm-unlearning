defaults:
  - _self_

experiment:
  seed: 42
  forget_concept: Stephen King
  push_to_hub: true

paths:
  output_dir: outputs/${training.mode}_grpo
  events_log: ${paths.output_dir}/events.jsonl
  final_model_dir: ${paths.output_dir}/final_model

model:
  name: "microsoft/Phi-3-mini-4k-instruct" # "microsoft/Phi-3-mini-4k-instruct", Qwen/Qwen2.5-3B-Instruct

wandb:
  run_name_prefix: ${training.mode}

data_generator:
  safe: false
  model_name: gpt-5.4-nano
  generation_context_size: 64
  new_prompts_per_step: 2

standard_data:
  name: jinzhuoran/RWKU
  config_name: train_refusal_phi3
  split: train
  subject_column: subject
  prompt_column: instruction
  dataset_size: 100 # Samples retained after filtering by forget_concept, e.g. 100.

buffer:
  max_prompts: 512
  high_reward_std_threshold: 0.2
  high_mean_reward_threshold: 0.75

reward:
  mode: entity_count # entity_count or binary

peft:
  lora:
    r: 32
    alpha: 64
    init_lora_weights: "gaussian"
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    number_layers_to_transform: 12

training:
  mode: standard # standard or adaptive
  per_device_train_batch_size: 8
  num_generations: 4
  gradient_accumulation_steps: 8
  gradient_checkpointing: True
  steps_per_generation: 8
  num_iterations: 2
  beta: 0.0 # 0.04
  max_steps: -1 # Set a positive value for adaptive mode; overrides num_epochs in standard mode.
  num_epochs: 1 # Applied only when mode is standard and max_steps is -1.
  learning_rate: 0.000005
  max_completion_length: 64 #256
  remove_unused_columns: false
  log_completions: true
  logging_steps: 5

hydra:
  job:
    chdir: false
