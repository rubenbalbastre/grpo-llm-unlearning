defaults:
  - _self_

experiment:
  seed: 42 # 1, 1234, 42
  forget_concept: Rihanna #Confucius # Stephen King
  push_to_hub: false

paths:
  output_root: outputs

model:
  name: "Qwen/Qwen2.5-3B-Instruct" # "microsoft/Phi-3-mini-4k-instruct", Qwen/Qwen2.5-3B-Instruct, Qwen/Qwen2.5-1.5B-Instruct

wandb:
  # Used by direct `python train.py` runs. `scripts/slurm-run-unlearning.sh`
  # overrides this with its per-job RUN_NAME so train and eval share one folder.
  run_name: ${training.mode}-${data_generator.data_proposer.mode}-${oc.env:SLURM_JOB_ID,local}

data_generator:
  safe: false
  new_prompts_per_step: 0.1 # Fraction of the rollout prompt batch generated each step.
  max_generated_prompts: 300 # Stop external prompt generation after this many accepted prompts; null disables the cap.
  data_proposer:
    model_name: gpt-5.4-nano
    mode: "natural" # natural or expanded
    execution:
      mode: async_individual # batch or async_individual
      max_concurrent_requests: 4 # async_individual only: maximum parallel external proposer requests.
      prompts_per_context_item: 2 # async_individual only: new prompt variants requested per selected context prompt.
    proposer_context:
      context_mode: rollout_outcomes # summary or rollout_outcomes
      context_max_prompts: 1 # Number of previous prompts selected as proposer context.
      context_max_completions_per_prompt: 4 # rollout_outcomes only: recent completions/rewards included per context prompt.

standard_data:
  name: jinzhuoran/RWKU
  config_name: train_refusal_phi3
  split: train
  subject_column: subject
  prompt_column: instruction
  dataset_size: 300 # Samples retained after filtering by forget_concept, e.g. 100.

offline_data:
  path: outputs/offline-synthetic/prompts_stephen_king.jsonl
  split: train
  prompt_column: prompt
  dataset_size: 100 # Samples retained from the fixed offline synthetic dataset, e.g. 100.

buffer:
  max_prompts: 512
  high_reward_std_threshold: 0.2
  high_mean_reward_threshold: 0.3

reward:
  mode: binary # entity_count or binary
  log_events: false # Set false to skip per-sample reward rows in events.jsonl.
  language:
    enabled: true # Set true to add a small fastText English-consistency reward.
    weight: 0.3 # Total reward = unlearning reward + weight * language reward.
    model_path: ${oc.env:FASTTEXT_LID_PATH,null} # Path to fastText lid.176.ftz or lid.176.bin.
    min_chars: 20 # Short completions are scored neutral because language ID is unreliable.
    english_confidence_threshold: 0.6 # +1 when top prediction is English above this confidence.
    uncertain_confidence_threshold: 0.6 # 0 when top prediction confidence is below this value; otherwise non-English is -1.

peft:
  lora:
    r: 64
    alpha: 128
    init_lora_weights: "gaussian"
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    number_layers_to_transform: -1 # Set to -1 to apply LoRA to all transformer layers.

training:
  mode: standard # adaptive, standard, or offline
  per_device_train_batch_size: 8
  num_generations: 8
  gradient_accumulation_steps: 16
  gradient_checkpointing: false
  steps_per_generation: 16
  num_iterations: 2
  beta: 0.04
  learning_rate: 1.0e-4 #1.0e-5, 1.0e-4 for 3B model
  max_completion_length: 256
  ddp_find_unused_parameters: false
  remove_unused_columns: false
  log_completions: true
  logging_steps: 5
  max_steps: 300 # too large since token budget callback will stop training when the token budget is reached. Set to -1 to disable.
  num_epochs: 40 # Applied only when mode is standard and max_steps is -1.
  lr_scheduler_type: "constant"
  callback:
    checkpoint_token_milestones: [1_500_000, 3_000_000, 4_500_000] # e.g. [1_500_000, 3_000_000, 4_500_000] to save checkpoints at token counts.
    token_budget: 6_000_000 #3_000_000 # null if not using StopOnTokenBudgetCallback

hydra:
  job:
    chdir: false
