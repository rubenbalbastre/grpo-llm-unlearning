defaults:
  - _self_

experiment:
  seed: 42
  forget_concept: Stephen King
  push_to_hub: true

paths:
  output_root: outputs

model:
  name: "Qwen/Qwen2.5-1.5B-Instruct" # "microsoft/Phi-3-mini-4k-instruct", Qwen/Qwen2.5-3B-Instruct

wandb:
  run_name: ${training.mode}-grpo-${oc.env:SLURM_JOB_ID,local}

data_generator:
  safe: false
  model_name: gpt-5.4-nano
  mode: "natural" # natural or expanded
  generation_context_size: 32
  new_prompts_per_step: 0.5 # Fraction of the rollout prompt batch generated each step.

standard_data:
  name: jinzhuoran/RWKU
  config_name: train_refusal_phi3
  split: train
  subject_column: subject
  prompt_column: instruction
  dataset_size: null # Samples retained after filtering by forget_concept, e.g. 100.

buffer:
  max_prompts: 512
  high_reward_std_threshold: 0.2
  high_mean_reward_threshold: 0.5

reward:
  mode: binary # entity_count or binary

peft:
  lora:
    r: 64
    alpha: 128
    init_lora_weights: "gaussian"
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    number_layers_to_transform: -1 # Set to -1 to apply LoRA to all transformer layers.

training:
  mode: standard # standard or adaptive
  per_device_train_batch_size: 16
  num_generations: 4
  gradient_accumulation_steps: 8
  gradient_checkpointing: True
  steps_per_generation: 8
  num_iterations: 2
  beta: 0.04 # 0.04
  max_steps: -1 # Set a positive value for adaptive mode; overrides num_epochs in standard mode.
  num_epochs: 40 # Applied only when mode is standard and max_steps is -1.
  learning_rate: 1.0e-5
  max_completion_length: 256 #256
  remove_unused_columns: false
  log_completions: true
  logging_steps: 5
  callback:
    token_budget: 3_000_000 # null if not using StopOnTokenBudgetCallback

hydra:
  job:
    chdir: false
