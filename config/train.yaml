defaults:
  - reward: r0
  - _self_

experiment:
  seed: 42 # 1, 1234, 42
  forget_concept: Rihanna # Rihanna #Confucius # Stephen King
  push_to_hub: false # binary
  notes: QA-only--apply-chat-template

paths:
  output_root: outputs

model:
  name: "Qwen/Qwen2.5-1.5B-Instruct" # "microsoft/Phi-3-mini-4k-instruct", Qwen/Qwen2.5-3B-Instruct, Qwen/Qwen2.5-1.5B-Instruct

wandb:
  # Used by direct `python train.py` runs. `scripts/slurm-run-unlearning.sh`
  # overrides this with its per-job RUN_NAME so train and eval share one folder.
  run_name: ${training.mode}-${data_generator.data_proposer.mode}-${oc.env:SLURM_JOB_ID,local}

data_generator:
  safe: false
  initial_standard_prompt_count: 64 # Adaptive mode warm-start prompts sampled from standard_data; null or 0 disables.
  new_prompts_per_step: 0.1 # Fraction of the rollout prompt batch generated each step.
  max_generated_prompts: 300 # Stop external prompt generation after this many accepted prompts; null disables the cap.
  data_proposer:
    model_name: gpt-5.4-nano
    objective: "general" # general, unlearning
    mode: "natural" # natural, expanded
    execution:
      mode: async_individual # batch or async_individual
      max_concurrent_requests: 4 # async_individual only: maximum parallel external proposer requests.
      prompts_per_context_item: 2 # async_individual only: new prompt variants requested per selected context prompt.
    proposer_context:
      context_mode: rollout_outcomes # summary or rollout_outcomes
      context_max_prompts: 1 # Number of previous prompts selected as proposer context.
      context_max_completions_per_prompt: 4 # rollout_outcomes only: recent completions/rewards included per context prompt.

standard_data:
  name: jinzhuoran/RWKU
  config_name: train_refusal_phi3
  split: train
  subject_column: subject
  prompt_column: instruction
  dataset_size: 300 # Samples retained after filtering by forget_concept, e.g. 100.
  shuffle_seed: 42
  test_size: 0.2

offline_data:
  path: outputs/offline-synthetic/prompts_stephen_king.jsonl
  split: train
  prompt_column: prompt
  dataset_size: 100 # Samples retained from the fixed offline synthetic dataset, e.g. 100.

buffer:
  max_prompts: 512
  high_reward_std_threshold: 0.2
  high_mean_reward_threshold: 0.3

reward:
  functions:
    simple_match:
      mode: length_aware
      pattern_splits: ["hard", "soft"]
      length_aware_min_words: 50
      length_aware_alpha: 20.0
    language:
      model_path: ${oc.env:FASTTEXT_LID_PATH,null} # Path to fastText lid.176.ftz or lid.176.bin.
      min_chars: 20 # Short completions are scored neutral because language ID is unreliable.
      english_confidence_threshold: 0.6 # +1 when top prediction is English above this confidence.
      uncertain_confidence_threshold: 0.6 # 0 when top prediction confidence is below this value; otherwise non-English is -1.
    fuzzy_match:
      mode: length_aware
      pattern_splits: ["hard"]
      length_aware_min_words: 50
      length_aware_alpha: 30.0
    llm-judge:
      model_name: gpt-5.4-nano
      temperature: 0.0
      max_concurrent_requests: 4
      activation_threshold: 0.8
    avoid_refusal_reward_classifier:
      model_name: garak-llm/garak-refusal-detector
      batch_size: 32
      truncation: true

peft:
  enabled: false # Set false for full fine-tuning.
  lora:
    r: 64
    alpha: 128
    init_lora_weights: "gaussian"
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    number_layers_to_transform: -1 # Set to -1 to apply LoRA to all transformer layers.

training:
  mode: standard # adaptive, standard, or offline
  # batch size
  per_device_train_batch_size: 8
  num_generations: 8
  gradient_accumulation_steps: 8
  gradient_checkpointing: true # false for 1.5B model, true for 3B model to reduce memory usage.
  steps_per_generation: 8
  # sampling
  temperature: 1.0
  top_p: 1.0
  max_completion_length: 256
  # logging
  remove_unused_columns: false
  log_completions: true
  logging_steps: 3
  save_final_model: false # Set false to keep only checkpoint-* snapshots.
  # learning rate, scheduler
  num_train_epochs: 40
  max_steps: 70 # too large since token budget callback will stop training when the token budget is reached. Set to -1 to disable.
  learning_rate: 1.0e-6 # for 1.5B model, 1.0e-4 for 3B model
  lr_scheduler_type: "constant" #"constant"
  warmup_ratio: 0 #0.05
  # others
  num_iterations: 2
  beta: 0.04 #0.04
  ddp_find_unused_parameters: false
  # eval
  eval_strategy: "steps"
  eval_steps: 100
  per_device_eval_batch_size: 8
  eval_accumulation_steps: 16
  num_generations_eval: 8
  # callbacks
  callback:
    checkpoint_token_milestones: [200_000, 400_000, 600_000, 800_000, 1_000_000, 1_200_000] # Save checkpoints at token counts.
    token_budget: 400_000 #3_000_000 # null if not using StopOnTokenBudgetCallback

hydra:
  job:
    chdir: false
